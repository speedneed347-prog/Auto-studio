services:
  - type: web
    name: fullstack-studio-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm turbo run build --filter=@fsv10/api...
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: web
    name: fullstack-studio-web
    runtime: static
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm turbo run build --filter=@fsv10/web...
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_API_URL
        sync: false
